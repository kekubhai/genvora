version: "3.8"

services:
  # PostgreSQL - Local development database
  postgres:
    image: postgres:15-alpine
    container_name: agentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Local cache and queue
  redis:
    image: redis:7-alpine
    container_name: agentlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server - Local workflow orchestration
  temporal:
    image: temporalio/auto-setup:latest
    container_name: agentlens-temporal
    restart: unless-stopped
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_SEEDS=postgres
      - POSTGRES_DB=temporal
    ports:
      - "7233:7233"  # Temporal frontend
      - "8233:8233"  # Temporal UI
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "tctl", "--address", "localhost:7233", "cluster", "health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # SigNoz - Observability (traces, metrics, logs)
  # Standalone image bundles ClickHouse + OTel Collector + SigNoz UI
  signoz:
    image: signoz/signoz-standalone:latest
    container_name: genvora-signoz
    restart: unless-stopped
    privileged: true
    ports:
      - "3333:8080"   # SigNoz UI (remapped to 3333 to avoid conflicts)
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    volumes:
      - signoz_clickhouse:/var/lib/clickhouse
      - signoz_data:/var/lib/signoz
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  signoz_clickhouse:
  signoz_data:
