version: "3.8"

services:
  # PostgreSQL - Local development database
  postgres:
    image: postgres:15-alpine
    container_name: agentlens-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agentlens
    ports:
      # Host 5433 avoids clash with other local Postgres containers on 5432
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Local cache and queue
  redis:
    image: redis:7-alpine
    container_name: agentlens-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal Server - Local workflow orchestration
  temporal:
    image: temporalio/auto-setup:1.25.2
    container_name: agentlens-temporal
    restart: unless-stopped
    environment:
      # Valid drivers: mysql8 | postgres12 | postgres12_pgx | cassandra
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PWD=postgres
      - POSTGRES_SEEDS=postgres
    ports:
      - "7233:7233"  # Temporal frontend
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 15s
      timeout: 5s
      retries: 15
      start_period: 30s

  # SigNoz is NOT in this Compose file.
  # Deploy reproducibly with Foundry from the repo root:
  #   foundryctl cast -f casting.yaml
  # UI http://localhost:8080  |  OTLP 4317/4318  |  MCP http://localhost:8000

volumes:
  postgres_data:
  redis_data:
